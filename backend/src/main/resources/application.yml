server:
  port: 8080

spring:
  application:
    name: ai-manager
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  api-key-secret: ${API_KEY_SECRET}
  sse:
    timeout: 120000
  quota:
    default-daily-limit: 20
    role-limits:
      'ROLE_USER': 20
      'ROLE_ADMIN': 999999
      'ROLE_SUPER_ADMIN': 999999
  security:
    public-paths:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/send-code
      - /api/auth/verify-code
      - /api/auth/refresh
      - /api/models
      - /api/chat
